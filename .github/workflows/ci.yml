name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versao vem do .nvmrc, a mesma do desenvolvimento: um npm diferente
      # do que gerou o package-lock quebra o npm ci.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build (static)
        run: npm run generate

      - name: Verify publication
        run: npm run verify:publication
